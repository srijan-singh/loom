name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "backend/loom/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/loom/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: backend/loom

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/loom/gradle/wrapper/gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/loom/build/reports/tests/test/
          retention-days: 7

  package:
    name: Package shadow JAR
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/loom/gradle/wrapper/gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build shadow JAR
        run: ./gradlew shadowJar --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: loom-engine
          path: backend/loom/build/libs/loom-engine.jar
          retention-days: 30
