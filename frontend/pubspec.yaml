name: loom_ui
description: Loom — AI workforce desktop application.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # HTTP client
  dio: ^5.4.0

  # Secure storage for API keys
  flutter_secure_storage: ^9.0.0

  # Preferences for flags (onboarding complete, etc.)
  shared_preferences: ^2.2.0

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Date/time formatting
  intl: ^0.19.0
  marionette_flutter: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.0
  patrol: ^4.10.0

flutter:
  uses-material-design: true
